name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Upload assets to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "public/build/"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            # `git pull` fusionne, donc il peut entrer en conflit : le 2026-08-19,
            # un composer.json modifié localement sur le serveur a bloqué le
            # déploiement en pleine course et laissé la production en 500.
            # `reset --hard` est idempotent : l'arbre devient une copie exacte de
            # main, quoi qu'il contienne.
            #
            # Pas de `git clean` ici : public/.htaccess et composer.phar ne sont
            # pas versionnés et doivent survivre.
            # Garde-fou, AVANT toute modification de l'arbre. Un déploiement qui
            # s'arrête à mi-parcours laisse la production avec du code neuf sur un
            # schéma ancien : c'est le pire état possible. Si l'utilisateur
            # PostgreSQL ne peut pas créer de table, une migration échouerait —
            # on refuse donc de commencer, plutôt que de casser en cours de route.
            # (1/0 lève une erreur SQL, donc un code de sortie non nul.)
            APP_ENV=prod php bin/console doctrine:query:sql \
              "SELECT 1/(has_schema_privilege(current_user,'public','CREATE'))::int" >/dev/null 2>&1 \
              || { echo "::error::Deploiement interrompu : l'utilisateur PostgreSQL ne peut pas creer de table dans le schema public. Une migration echouerait a mi-parcours. Rien n'a ete modifie sur le serveur."; exit 1; }

            git fetch origin main
            git reset --hard origin/main
            APP_ENV=prod php composer.phar install --no-dev --optimize-autoloader
            APP_ENV=prod php bin/console doctrine:migrations:migrate --no-interaction
            APP_ENV=prod php bin/console cache:clear
            APP_ENV=prod php bin/console cache:warmup