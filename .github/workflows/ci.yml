name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pgsql, intl, mbstring
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHP CS Fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Twig CS Fixer
        run: vendor/bin/twig-cs-fixer lint

      - name: PHPStan
        run: vendor/bin/phpstan analyse

      - name: PHPUnit
        run: php bin/phpunit
        env:
          APP_ENV: test
          DATABASE_URL: "sqlite:///%kernel.project_dir%/var/test.db"

  e2e:
    name: Accessibility (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, intl, mbstring
          coverage: none
          tools: composer:v2, symfony-cli

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        # Dev build: the audit needs the stylesheet, not the hashed production bundle,
        # and encore dev is several times faster.
        run: npm run dev

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright headless shell
        # --only-shell installs the lightweight Chrome headless shell rather than full
        # Chromium. On a cache hit only the OS libraries are (re)installed.
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium-headless-shell
          else
            npx playwright install --with-deps --only-shell chromium
          fi

      - name: Run the accessibility suite
        # The suite starts the site and the Cookbook API stub itself, and builds its own
        # SQLite database in tests/e2e/global-setup.js.
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─── Continuous deployment ────────────────────────────────────────────────
  # Build & push the production FrankenPHP image to GHCR, tagged `latest` and
  # the commit SHA. Runs ONLY on push to main and ONLY once both jobs above are
  # green, so a broken commit never produces a `latest` image. Coolify pulls
  # the image as-is — it does not build it — see docs/deploy/coolify.md.
  build-images:
    name: Build & Push Image (GHCR)
    needs: [ci, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/frankenphp
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frankenphp/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
