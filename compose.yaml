
services:
  # Symfony Application — FrankenPHP (PHP 8.3 + Caddy), no nginx / php-fpm.
  app:
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
    image: radiant:dev
    container_name: radiant_app
    ports:
      - "8080:80"
    volumes:
      # Mount source code for development
      - .:/app
      # Exclude vendor and node_modules for performance
      - /app/vendor
      - /app/node_modules
      # Caddyfile is baked into the image too, but mounted read-only so it can be
      # edited without a rebuild.
      - ./docker/frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      # Mount uploads directory
      - ./public/documents:/app/public/documents
    environment:
      - APP_ENV=dev
      - APP_DEBUG=1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8
      - MAILER_DSN=smtp://mailer:1025
    depends_on:
      database:
        condition: service_healthy
      mailer:
        condition: service_started
    networks:
      - radiant_network
      # Shared with the Cookbook stack — this is how the Cookbook mini-app reaches
      # the API, at http://cookbook_app. See COOKBOOK_API_URL in .env.local.
      - korhy_net

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    container_name: radiant_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
    networks:
      - radiant_network
###< doctrine/doctrine-bundle ###

volumes:
  database_data:
    driver: local

networks:
  radiant_network:
    driver: bridge

  # Cross-project network shared with ~/code/korhy/PHP/Symfony/cookbook.
  # External on purpose: it outlives `make down` on either side, and the Cookbook
  # stack does not have to be running for this one to start — when it is down the
  # client degrades through CookbookUnavailableException, as it already did.
  # `make net` (a prerequisite of `make up`) creates it if missing.
  korhy_net:
    external: true
